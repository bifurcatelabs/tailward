[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tailward"
version = "2.6.0"
description = "Tailward — a local-first audit underlay for Claude Code. Surfaces user and platform signal from your sessions; tails local JSONL with optional local-LLM integration. Public name is tailward; CLI binary is warden; internal package is modmcp."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Glenn Walker", email = "glenn@bifurcate.io" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "watchfiles>=0.22",
    "httpx>=0.27",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "openai>=1.40",
    "plyer>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/bifurcatelabs/tailward"
Mirror = "https://git.bifurcate.io/active/warden"

[project.scripts]
# ``warden`` is the canonical CLI binary as of v2.0.0. ``modmcp`` is
# kept as a backward-compat alias for users who already have it in
# their muscle memory or wired into Claude Code MCP / hook configs.
# Both invoke the same entry point. Slated for removal in v3.0.0.
warden = "modmcp.cli:main"
modmcp = "modmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/modmcp/cli.py" = ["B008"]   # typer.Option() in defaults is idiomatic
