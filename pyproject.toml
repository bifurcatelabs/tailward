[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tailward"
version = "2.9.0"
description = "Tailward — a local-first audit underlay for Claude Code. Surfaces user and platform signal from your sessions; tails local JSONL with optional local-LLM integration. Public name + CLI + internal package are all ``tailward``; ``warden`` is preserved as a CLI deprecation alias."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Glenn Walker", email = "glenn@bifurcate.io" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "watchfiles>=0.22",
    "httpx>=0.27",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "openai>=1.40",
    "plyer>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/bifurcatelabs/tailward"
Repository = "https://github.com/bifurcatelabs/tailward"
Issues = "https://github.com/bifurcatelabs/tailward/issues"
Changelog = "https://github.com/bifurcatelabs/tailward/blob/main/CHANGELOG.md"
Mirror = "https://git.bifurcate.io/active/tailward"

[project.scripts]
# ``tailward`` is the canonical CLI binary as of v2.7.0 (full rename
# alignment — public name, internal package, and CLI all match).
# ``warden`` is preserved as a deprecation alias for users who already
# have v2.x muscle memory or scripts; it will be removed in v4.0.0.
# ``modmcp`` is removed (it was the original alias kept through v2.x;
# now retired).
tailward = "tailward.cli:main"
warden = "tailward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tailward"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tailward/cli.py" = ["B008"]   # typer.Option() in defaults is idiomatic
