[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "modmcp"
version = "2.0.0"
description = "Warden — a local-first trust layer for AI coding workflows. Passive transcript audit, mode-aware rubric scoring, in-band inference-path metrics. Internal package name is modmcp; the CLI binary and product surface are warden."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Glenn Walker", email = "glenn@glennw.net" }]

[project.urls]
Repository = "https://git.bifurcate.io/active/warden"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "watchfiles>=0.22",
    "httpx>=0.27",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "mcp>=1.0",
    "openai>=1.40",
    "plyer>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
modmcp = "modmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/modmcp/cli.py" = ["B008"]   # typer.Option() in defaults is idiomatic
