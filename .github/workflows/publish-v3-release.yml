name: publish v3 release

# Triggered by pushing a ``v*`` tag (e.g. ``v3.0.0``). Builds the
# Tauri desktop app for Windows + Linux in parallel, signs the
# Windows artifacts via Azure Trusted Signing (federated OIDC, no
# PFX or client secret in CI), and creates a draft GitHub Release
# with all artifacts attached.
#
# The release stays a DRAFT until a maintainer publishes it from
# the Releases page — same human-gated pattern as the ``pypi``
# environment used by publish-to-pypi.yml.
#
# Tag trigger is broad (``v*``); the ``release`` environment's
# "Deployment branches and tags" rule restricts the actual gated
# steps to v*.*.* (semver-only). Pre-release tags like
# ``v3.0.0-rc1`` will trigger the workflow but block at the
# Windows + macOS signing jobs until a maintainer relaxes the rule.
#
# macOS signs + notarizes via Apple Developer ID + notarytool,
# driven by Tauri 2.x's built-in handling of the ``APPLE_*`` env
# vars (cert imported into a temp keychain, app signed under
# hardened runtime, submitted to Apple's notarytool, ticket
# stapled into the .dmg). End-to-end install verification on a
# real Mac is the only thing not covered by CI; arrange that
# separately before announcing a release.

on:
  push:
    tags:
      - "v*"
  # Manual trigger for smoke-testing the workflow infrastructure
  # without burning a real Trusted Signing transaction. Default
  # ``dry_run=true`` is intentional — clicking "Run workflow" with
  # no changes does the safe thing. To fully exercise signing from
  # a dispatch (instead of from a tag push), uncheck dry_run in the
  # Actions UI.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Azure signing + release creation (smoke-tests build only)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows:
    name: build + sign windows
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write    # OIDC token for Azure auth
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        # taiki-e/install-action uses prebuilt binaries when available;
        # falls back to ``cargo install`` otherwise. ~10s vs ~5min for
        # building tauri-cli from source.
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.1

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build frontend (Svelte SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build PyInstaller daemon bundle
        run: |
          pyinstaller --onefile --name tailward-daemon --noconfirm `
            --add-data "src/tailward/web/templates;tailward/web/templates" `
            --add-data "src/tailward/web/static/dist;tailward/web/static/dist" `
            src/tailward/daemon/__main__.py
        shell: pwsh

      - name: Place sidecar binary at Tauri's expected path
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist/tailward-daemon.exe `
            src-tauri/binaries/tailward-daemon-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: Build Tauri app (release)
        working-directory: src-tauri
        run: cargo tauri build

      - name: Azure login via OIDC federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows artifacts via Azure Trusted Signing
        # Skipped on dispatch with dry_run=true (default for manual
        # runs). Tag pushes always sign — ``inputs.dry_run`` is
        # undefined on push triggers and the comparison evaluates as
        # not-equal-to-true.
        if: ${{ inputs.dry_run != true }}
        uses: azure/trusted-signing-action@v0.5
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: bifurcate
          certificate-profile-name: tailward-public-trust
          files-folder: src-tauri/target/release/bundle
          files-folder-recurse: true
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tailward-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: build linux (unsigned)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Tauri system deps
        # webkit2gtk + GTK + appindicator + librsvg are Tauri's runtime
        # WebView dependencies on Linux. libssl-dev is needed by the
        # Rust ``reqwest`` crate's rustls-tls feature for the daemon
        # health probe.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.1

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build frontend (Svelte SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build PyInstaller daemon bundle
        # PyInstaller --add-data uses ``:`` as separator on Linux/macOS
        # vs ``;`` on Windows. Match the OS or the bundle silently
        # treats the second half as a separate input file.
        run: |
          pyinstaller --onefile --name tailward-daemon --noconfirm \
            --add-data "src/tailward/web/templates:tailward/web/templates" \
            --add-data "src/tailward/web/static/dist:tailward/web/static/dist" \
            src/tailward/daemon/__main__.py

      - name: Place sidecar binary at Tauri's expected path
        run: |
          mkdir -p src-tauri/binaries
          cp dist/tailward-daemon \
            src-tauri/binaries/tailward-daemon-x86_64-unknown-linux-gnu

      - name: Build Tauri app (release)
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tailward-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-macos:
    name: build + sign macos
    runs-on: macos-26
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Diagnostic — runner arch + rustc host
        # Surfaces both the OS-reported architecture and the toolchain's
        # host triple so a future arch-mismatch failure points at the
        # right side: runner-pool issue (Intel served on an arm-labeled
        # image) vs toolchain-install issue (rustup picked x86_64 on an
        # arm host via some Rosetta path).
        run: |
          echo "uname -m: $(uname -m)"
          echo "arch:     $(arch)"
          rustc -vV
        shell: bash

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.1

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build frontend (Svelte SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build PyInstaller daemon bundle
        # macOS uses ``:`` separator for --add-data (vs ``;`` on Windows).
        run: |
          pyinstaller --onefile --name tailward-daemon --noconfirm \
            --add-data "src/tailward/web/templates:tailward/web/templates" \
            --add-data "src/tailward/web/static/dist:tailward/web/static/dist" \
            src/tailward/daemon/__main__.py

      - name: Place sidecar binary at Tauri's expected path
        run: |
          mkdir -p src-tauri/binaries
          cp dist/tailward-daemon \
            src-tauri/binaries/tailward-daemon-aarch64-apple-darwin

      - name: Build Tauri app (release, signed + notarized on tag)
        # When DRY_RUN=true the signing env vars are unset before
        # ``cargo tauri build`` runs, so Tauri builds an unsigned
        # .dmg (smoke-test path — no Apple notarization round-trip).
        # When DRY_RUN!=true (tag push or non-dry dispatch), Tauri
        # imports the cert into a temp keychain, signs the .app +
        # bundled binaries with hardened runtime, submits to
        # notarytool, waits for notarization, and staples the ticket
        # into the .dmg.
        working-directory: src-tauri
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          rustup target add aarch64-apple-darwin
          cargo tauri build --target aarch64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tailward-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  publish:
    name: create draft github release
    needs: [build-windows, build-linux, build-macos]
    # Skipped on dispatch with dry_run=true. Build artifacts still
    # land on the workflow run page (downloadable from there) — no
    # release polluting the Releases page on smoke-test runs.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # required for creating the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create draft release
        # Draft = release shows up on the Releases page but is not
        # public. Maintainer publishes manually after smoke-testing
        # the artifacts. Same human-gated pattern as the pypi flow.
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
