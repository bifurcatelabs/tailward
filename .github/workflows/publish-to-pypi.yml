name: publish to pypi

# Triggered by pushing a ``v*`` tag (e.g. ``git tag v2.6.1 && git push
# origin v2.6.1``). Builds the sdist + wheel, then publishes to PyPI
# via Trusted Publishing (OIDC) — no API token stored anywhere; PyPI
# verifies the workflow's GitHub identity at publish time.
#
# PyPI side: trusted publisher registered at
# https://pypi.org/manage/project/tailward/settings/publishing/ with
# matching ``owner`` / ``repository`` / ``workflow_filename`` /
# ``environment`` values. GitHub side: a ``pypi`` environment with
# Required Reviewers enabled — every tag publish waits for explicit
# approval, so a compromised tag can't auto-fire malware to the index.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The publish step runs in a separate job that downloads
          # the artifact — no need to keep credentials around in this
          # job. Tightens the OIDC scope.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      # The wheel includes the compiled Svelte bundle (via the artifacts
      # directive in pyproject.toml). It must exist on disk before
      # `python -m build` runs, or the wheel ships without a UI.
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      # Guard against shipping a wheel that installs but can't serve the UI
      # (the 2026-05 frontend-missing-from-wheel bug). Install the built
      # wheel clean, start the daemon, and assert it serves the real SPA
      # bundle + JSON — not the "run npm build" fallback or an HTML page.
      - name: Smoke-test the built wheel serves the UI
        run: |
          mkdir -p ~/.claude/projects
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/tailward daemon start
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7878/health >/dev/null && break || sleep 1
          done
          curl -s http://127.0.0.1:7878/ | grep -Eq 'static/dist/assets/index-.*\.js' \
            || { echo "FAIL: wheel served no SPA bundle (frontend missing from wheel)"; /tmp/smoke/bin/tailward daemon stop || true; exit 1; }
          curl -s http://127.0.0.1:7878/v2/projects | /tmp/smoke/bin/python -c 'import sys,json; json.load(sys.stdin)' \
            || { echo "FAIL: /v2/projects returned non-JSON (UI cannot reach API)"; /tmp/smoke/bin/tailward daemon stop || true; exit 1; }
          /tmp/smoke/bin/tailward daemon stop || true
          echo "Smoke test passed: wheel serves the SPA bundle + JSON API."
      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: publish to pypi
    needs: build
    runs-on: ubuntu-latest
    # The environment name MUST match what's configured on PyPI's
    # trusted publisher form. Required-reviewer protection rules on
    # this environment gate the publish step until a maintainer
    # approves on the GitHub Actions run page.
    environment:
      name: pypi
      url: https://pypi.org/p/tailward
    permissions:
      # OIDC trusted publishing requires id-token write at the job
      # level. ``contents`` defaults to none here since we only
      # download the build artifact, never read the repo source.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        # ``release/v1`` is the moving pointer at the latest stable
        # major. Generates PEP 740 attestations automatically (since
        # v1.11.0) — supply-chain hygiene for free. Pin to an exact
        # tag if attestations or the action surface drift over time.
        uses: pypa/gh-action-pypi-publish@release/v1
