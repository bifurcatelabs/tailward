<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}modmcp{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #1a1d24;
            --fg: #d6deeb;
            --muted: #8a99b8;
            --accent: #82aaff;
            --ok: #9ece6a;
            --warn: #e0af68;
            --err: #f7768e;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }
        header {
            padding: 12px 24px;
            border-bottom: 1px solid #2a2e38;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header a {
            color: var(--fg);
            text-decoration: none;
        }
        header h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin: 0;
            text-transform: uppercase;
        }
        header nav a {
            color: var(--muted);
            margin-right: 16px;
            font-size: 13px;
        }
        header nav a:hover { color: var(--fg); }
        main { padding: 24px; max-width: 1100px; margin: 0 auto; }
        h2 { font-size: 18px; margin: 0 0 12px; }
        h3 { font-size: 14px; color: var(--muted); margin: 16px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #2a2e38; }
        th { color: var(--muted); font-weight: 500; }
        tr:hover td { background: #151820; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .panel { background: var(--panel); border: 1px solid #2a2e38; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        textarea {
            width: 100%;
            min-height: 80px;
            background: #0c0e13;
            color: var(--fg);
            border: 1px solid #2a2e38;
            border-radius: 4px;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        input[type=text], input[type=number], select {
            background: #0c0e13;
            color: var(--fg);
            border: 1px solid #2a2e38;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 13px;
        }
        button {
            background: var(--accent);
            color: #0f1115;
            border: 0;
            border-radius: 4px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        .sev-high { color: var(--err); }
        .sev-med  { color: var(--warn); }
        .sev-low  { color: var(--ok); }
        .status-verified     { color: var(--ok); }
        .status-contradicted { color: var(--err); }
        .status-unverifiable { color: var(--warn); }
        .muted { color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">modmcp</a></h1>
        <nav>
            <a href="/">projects</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
