{% extends "base.html" %}
{% block title %}{{ intent.front.project_name }} — intent{% endblock %}
{% block content %}
<h2>{{ intent.front.project_name }}</h2>
<p class="muted">{{ intent.front.project_path }}</p>
<p>
    <a href="/p/{{ ph }}">intent</a> ·
    <a href="/p/{{ ph }}/ledger">ledger</a> ·
    <a href="/p/{{ ph }}/drift">drift</a>
</p>

<form hx-post="/p/{{ ph }}/save" hx-target="#save-status">
    <div class="panel">
        <h3>Metadata</h3>
        <label>session_mode
            <select name="session_mode">
                {% for m in ["build", "meta", "exploration"] %}
                <option value="{{ m }}" {% if intent.front.session_mode == m %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </label>
        &nbsp;&nbsp;
        <label title="Only applies in active mode. In passive mode the hook does not inject corrections, so this counter is inert.">phase2_turns_remaining
            <input type="number" name="phase2_turns_remaining" value="{{ intent.front.phase2_turns_remaining }}" min="0" style="width:80px"{% if warden_mode == "passive" %} disabled{% endif %}>
            {% if warden_mode == "passive" %}<span class="muted" style="font-size:11px">(active mode only)</span>{% endif %}
        </label>
    </div>

    {% for section in sections %}
    <div class="panel">
        <h3>{{ section }}</h3>
        <textarea name="section[{{ section }}]">{{ intent.sections.get(section, '') }}</textarea>
    </div>
    {% endfor %}

    <button type="submit">Save</button>
    <span id="save-status" class="muted" style="margin-left: 12px;"></span>
</form>
{% endblock %}
