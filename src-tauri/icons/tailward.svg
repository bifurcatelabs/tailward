<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tailward TW monogram — source for tray, taskbar, favicon, and
  installed-app icon generation. Square 600x600 viewBox with the
  design centered (paths shifted +36x +136y from the in-app SVG).
  Copper gradient hardcoded (no CSS variables) so this file is
  self-contained for icon-generation tools (tauri icon, ImageMagick,
  Inkscape CLI, etc.).

  Match in-app HeaderBar.svelte: stroke-width tuned for the in-app
  22px display (~1.9px effective stroke). Icon generators scale this
  proportionally so the same weight reads correctly at 16 / 32 / 128
  / 256 / 512 px outputs.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  width="600"
  height="600"
  role="img"
  aria-label="tailward TW monogram"
>
  <defs>
    <!-- Fully opaque gradient for bundled-icon rendering. The in-app
         SVG uses a translucent bottom-left stop (0.55) for the
         "lit from above" feel against the app's consistent dark
         surface; on the OS taskbar / tray the icon sits over varied
         backgrounds, so transparency reads as "ghosted" rather than
         "atmospheric." Color luminance (e89968 → f5b58e) still
         provides the gradient direction. -->
    <linearGradient id="twCopper" x1="0" y1="600" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e89968" stop-opacity="1"/>
      <stop offset="1" stop-color="#f5b58e" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g
    fill="none"
    stroke="url(#twCopper)"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Content scaled up ~18% (around viewBox center 300,300) so the
         icon fills more of the 600x600 canvas — without this, the
         naturally-wide-but-not-tall design left ~30% vertical
         whitespace top + bottom and the icon read smaller than
         neighbors in the Windows taskbar. 1.18 is the safe max:
         beyond that the W's rightmost round-cap clips the viewBox.
         Stroke scaled to match to maintain visual line weight. -->
    <!-- T crossbar -->
    <path d="M29 167 H318"/>
    <!-- T stem with curved foot tail -->
    <path d="M140 167 V404 C140 425 156 438 176 438 H209"/>
    <!-- W zigzag, shifted right of T so the curved tail is visible -->
    <path d="M224 239 C239 239 246 250 254 267 L326 413 L392 285 L463 423 L571 177"/>
  </g>
</svg>
