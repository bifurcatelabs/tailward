[package]
name = "tailward"
version = "0.1.0"
description = "Native shell for tailward — local-first audit underlay for Claude Code."
authors = ["Glenn Walker <glenn@bifurcate.io>"]
license = "MIT"
repository = "https://github.com/bifurcatelabs/tailward"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tailward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# Prevents a second invocation of tailward.exe from spawning a duplicate
# window when one is already running. Forwards the second invocation's
# args + cwd to the existing instance, which focuses its window. Crucial
# for the spawn-or-reuse decision: without this, double-launching the app
# would race two instances at the bundled-daemon spawn step and the
# second one's :7878 bind would fail.
tauri-plugin-single-instance = "2"
# Persists window position + size + maximized/minimized state across
# launches so a user who resizes once gets it remembered. Default
# storage is ~/.local/share/<bundle>/window-state.json (or platform
# equivalent); no extra wiring needed beyond plugin init.
tauri-plugin-window-state = "2"
# Used for the daemon health-check probe in setup() — minimal feature set
# since we only ever hit plain-HTTP loopback. ``rustls-tls`` is pulled in
# only because reqwest's default builder requires *some* TLS backend
# config; we never actually negotiate TLS here.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Pulled in for ``tokio::time::sleep`` in the health-check poll loop.
# Tauri uses tokio internally but doesn't re-export the time module.
# Minimum viable feature set; we don't need the full tokio surface.
tokio = { version = "1", features = ["time"] }
# WebviewUrl::External takes a url::Url. Already in the tree
# transitively (reqwest, tauri); listing explicitly to make the
# dependency intentional.
url = "2"
